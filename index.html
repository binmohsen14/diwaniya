<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الديوانية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eee4;--sf:#fbfcf7;--tx:#14302b;--mu:#5f736c;--gd:#a97a22;--hd:#15403a;--gr:#23704f;--rd:#a33f2c;--bd:#cfdacb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1c19;--sf:#162a26;--tx:#e6eee3;--mu:#97ada5;--gd:#dcae52;--hd:#0a2b26;--gr:#6fc79c;--rd:#ee8a74;--bd:#27403a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1c19;--sf:#162a26;--tx:#e6eee3;--mu:#97ada5;--gd:#dcae52;--hd:#0a2b26;--gr:#6fc79c;--rd:#ee8a74;--bd:#27403a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;padding-bottom:84px}
header{background:var(--hd);color:#f3ead2;padding:18px 16px 14px;text-align:center;border-radius:0 0 28px 28px}
.wm{font:700 46px/1.4 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#e8bd5f;margin:0}
.orn{display:block;margin:2px auto 4px}
header small{opacity:.8}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-top:10px}
main{padding:14px;max-width:640px;margin:auto}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2,h3{margin:0 0 6px}
.mu{color:var(--mu);margin:0}
small{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.b{font:inherit;background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer}
.b:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.b.sel{background:var(--hd);color:#f3ead2;border-color:var(--hd)}
.k{flex:1;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:6px;font:700 22px/1.2 "IBM Plex Sans Arabic",system-ui,sans-serif}
.k i{display:block;font:400 13px "IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--mu);font-style:normal}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd)}
.y{color:var(--gr);font-weight:700}.n{color:var(--rd);font-weight:700}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:8px;min-width:0}
.f{display:flex;gap:8px;margin-top:8px}.f input:first-child{flex:1}
.f input[type=number]{width:90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;font:inherit;font-size:14px;background:none;border:0;color:var(--mu);padding:14px 2px}
nav button.on{color:var(--gd);font-weight:700;box-shadow:inset 0 3px 0 var(--gd)}
.tot{font:700 20px "IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--gd)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.o{font:inherit;display:flex;flex-direction:column;align-items:center;background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:8px 4px;cursor:pointer}
.o span{font-size:30px;line-height:1.3}.o small{font-size:12px}
.o.sel{border-color:var(--gd);background:var(--bg);box-shadow:inset 0 0 0 1px var(--gd)}
.o:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const M=["عبدالعزيز بن فهد","محمد بن فهد","عبدالله بن محمد","ناصر بن صالح","عبدالرحمن بن فهد","ريان بن صالح","هشام بن ابراهيم","عبداللطيف بن محمد","محمد بن صالح","فيصل بن احمد","الوليد بن محسن","فارس بن فهد","عبدالله بن احمد","نايف بن خالد"];
const ADM=["محمد بن فهد"];
const HASH="c8b28bb79d626fc0c0ca0df542b95d9f6299c3ddb5f43b24110a39f9d9b49958";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const CATS=["ملازيم قهوة وشاي","منظفات","بهانيس","مياه","صيانة بسيطة","أخرى"];
const D0={me:"",admin:false,rsvp:{},why:{},tv:{cook:[],rest:[]},co:[{t:"كبسة",i:"🍛",v:[]},{t:"مكرونة",i:"🍝",v:[]},{t:"مرقوق",i:"🥘",v:[]}],ro:[{t:"برجر",i:"🍔",v:[]},{t:"مشاوي",i:"🍖",v:[]},{t:"بروستد",i:"🍗",v:[]},{t:"بيتزا",i:"🍕",v:[]}],cook:"",shop:[],orders:{},join:{},gear:[["خيمة كبيرة",""],["حطب وفحم",""],["دلة وشاي وقهوة",""],["ماء وثلج",""],["سفرة وفرش",""]],cars:{},kc:[],paid:{},ex:[],ideas:[{t:"بطولة بلوت بين فريقين",v:[]},{t:"كشتة ليلة الجمعة القادمة",v:[]}],tab:0,pend:"",ok:false,bad:0};
let S;try{S=Object.assign({},D0,JSON.parse(localStorage.getItem("dw2")||"{}"))}catch(e){S=D0}
const save=()=>{try{localStorage.setItem("dw2",JSON.stringify(S))}catch(e){}};
if(!ADM.includes(S.me)||!S.ok)S.admin=false;S.pend="";
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=x=>Number(x)||0,V=id=>document.getElementById(id).value.trim();
const att=()=>M.filter(m=>S.rsvp[m]=="y");
const lead=()=>{const c=S.tv.cook.length,r=S.tv.rest.length;return c>r?"cook":r>c?"rest":""};
const vb=(a,v,i,t,c,on)=>`<button class="o${on?" sel":""}" data-a="${a}" data-v="${v}"><span>${i}</span>${t}<small>${c} صوت</small></button>`;
const btn=(a,v,t,on)=>`<button class="b${on?" sel":""}" data-a="${a}" data-v="${E(v)}">${t}</button>`;
const mem=()=>`<option value="">اختر</option>`+M.map(m=>`<option${S.cook==m?" selected":""}>${m}</option>`).join("");
const hdr=()=>`<header><h1 class="wm">الديوانية</h1><svg class="orn" width="150" height="14" viewBox="0 0 150 14"><path d="M0 7h62M88 7h62" stroke="#e8bd5f" stroke-width="1.5"/><path d="M75 1l6 6-6 6-6-6z" fill="#e8bd5f"/></svg><small>مجلس الشباب، كل أسبوع</small>${S.me?`<div class="bar"><span>${S.me}</span>${S.ok&&ADM.includes(S.me)?btn("adm","","وضع المشرف: "+(S.admin?"تشغيل":"إيقاف"),S.admin):""}${btn("out","","تغيير الاسم")}</div>`:""}</header>`;

function home(){
const y=att().length,n=M.filter(m=>S.rsvp[m]=="n").length,my=S.rsvp[S.me]||"";
return `<div class="c"><small>اللقاء القادم (بيانات تجريبية)</small><h2>الجمعة ٢٧ نوفمبر، ٨:٣٠ م</h2><p class="mu">الاستراحة، والعشاء: ${lead()=="cook"?"طبخ":lead()=="rest"?"مطعم":"بالتصويت"}</p>
<div class="row"><span class="k">${y}<i>جاي</i></span><span class="k">${n}<i>معتذر</i></span><span class="k">${14-y-n}<i>ما ردّ</i></span></div>
<b>ردّك</b><div class="row">${btn("rsvp","y","جاي",my=="y")}${btn("rsvp","n","معتذر",my=="n")}${btn("rsvp","","لاحقًا",!my)}</div>
${my=="n"?`<small>سبب الاعتذار</small><div class="row">${["سفر","عمل","ظرف عائلي","مرض","أخرى"].map(w=>btn("why",w,w,S.why[S.me]==w)).join("")}</div>`:""}</div>
<div class="c"><h3>الحضور</h3>${M.map(m=>{const s=S.rsvp[m];return `<div class="li"><span>${m}</span>${s=="y"?'<span class="y">جاي</span>':s=="n"?`<span class="n">معتذر${S.why[m]?" ("+E(S.why[m])+")":""}</span>`:'<small>ما ردّ</small>'}</div>`}).join("")}</div>`}

function dinner(){
const L=lead(),y=att().length;
let h=`<div class="c"><h3>عشاء اللقاء</h3><small>١. صوّت: طبخ أو مطعم</small><div class="g">${vb("tv","cook","🍳","طبخ",S.tv.cook.length,S.tv.cook.includes(S.me))}${vb("tv","rest","🛵","مطعم",S.tv.rest.length,S.tv.rest.includes(S.me))}</div></div>`;
if(!L)return h+`<div class="c"><p class="mu">ما فيه أصوات أو تعادل. صوّتوا ليتحدد النوع.</p></div>`;
const O=S[L=="cook"?"co":"ro"],w=[...O].sort((a,b)=>b.v.length-a.v.length)[0];
h+=`<div class="c"><small>٢. صوّت على ${L=="cook"?"الأكلة":"الوجبة"}</small><div class="g3">${O.map((o,i)=>vb("ov",i,o.i,o.t,o.v.length,o.v.includes(S.me))).join("")}</div>${w.v.length?`<p class="mu">الأعلى تصويتًا: <b>${w.i} ${w.t}</b></p>`:""}<div class="f"><input id="oi2" placeholder="اقتراح جديد"><button class="b sel" data-a="oadd">أضف اقتراح</button></div></div>`;
if(L=="cook")return h+`<div class="c"><small>٣. الطباخ والمقاضي</small><div class="f"><select data-a="cook" style="flex:1">${mem()}</select></div>${S.shop.map(s=>`<div class="li"><span>${E(s)}</span></div>`).join("")||'<p class="mu">القائمة فاضية، أضف أول بند.</p>'}<div class="f"><input id="si" placeholder="مثال: رز بسمتي"><button class="b sel" data-a="shop">أضف بند</button></div></div>`;
const my=S.orders[S.me]||[],sub=m=>(S.orders[m]||[]).reduce((a,x)=>a+N(x.p),0),tot=att().reduce((a,m)=>a+sub(m),0);
h+=`<div class="c"><small>٣. سجّل طلبك</small>${S.rsvp[S.me]=="y"?`<div class="f"><input id="oi" placeholder="مثال: بروستد حراق"><input id="op" type="number" placeholder="ر.س"></div><div class="row"><button class="b sel" data-a="ord">أضف للطلب</button></div>`:`<p class="mu">سجّل حضورك "جاي" أول عشان تضيف طلبك.</p>`}${my.map((x,i)=>`<div class="li"><span>${E(x.t)}</span><span>${N(x.p)} ${btn("del",i,"حذف")}</span></div>`).join("")}</div>`;
return h+`<div class="c"><h3>طلبات الحاضرين</h3>${att().map(m=>`<div class="li"><span><b>${m}</b><br><small>${(S.orders[m]||[]).map(x=>E(x.t)).join("، ")||"لم يطلب"}</small></span><b>${sub(m)}</b></div>`).join("")}<div class="li"><b>المجموع</b><span class="tot">${tot} ر.س</span></div><div class="li"><b>لو انقسم بالتساوي على ${y} حاضر</b><span class="tot">${y?(tot/y).toFixed(1):0} ر.س</span></div></div>`}

function kashta(){
const j=M.filter(m=>S.join[m]),kt=S.kc.reduce((a,c)=>a+N(c[1]),0),cars=Object.keys(S.cars);
return `<div class="c"><small>كشتة تجريبية</small><h2>طلعة ترفيهية</h2><p class="mu">المكان والتاريخ يتحددان بالتصويت. المشاركون: ${j.length}</p><div class="row">${btn("join","",S.join[S.me]?"مشارك":"أبغى أشارك",S.join[S.me])}</div></div>
<div class="c"><h3>المعدات</h3>${S.gear.map((g,i)=>`<div class="li"><span>${g[0]}</span>${g[1]&&g[1]!=S.me?`<small>${g[1]}</small>`:btn("gear",i,g[1]?"أنا متكفل (إلغاء)":"أتكفل به",g[1]==S.me)}</div>`).join("")}</div>
<div class="c"><h3>السيارات والمقاعد</h3><div class="f"><select data-a="car" style="flex:1">${[0,1,2,3,4,5].map(n=>`<option value="${n}"${(S.cars[S.me]||0)==n?" selected":""}>${n?"معي سيارة وفيها "+n+" مقاعد فاضية":"ما معي سيارة"}</option>`).join("")}</select></div>${cars.map(m=>`<div class="li"><span>${m}</span><b>${S.cars[m]} مقاعد</b></div>`).join("")}</div>
<div class="c"><h3>تكاليف الكشتة</h3><small>منفصلة عن القطة، وتنقسم على المشاركين فقط</small>${S.kc.map(c=>`<div class="li"><span>${E(c[0])}</span><b>${N(c[1])}</b></div>`).join("")}<div class="f"><input id="kt" placeholder="البند"><input id="kp" type="number" placeholder="ر.س"></div><div class="row"><button class="b sel" data-a="kcadd">أضف تكلفة</button></div><div class="li"><b>نصيب كل مشارك</b><span class="tot">${j.length?(kt/j.length).toFixed(1):0} ر.س</span></div></div>`}

function qatta(){
const p=M.filter(m=>S.paid[m]).length,ex=S.ex.reduce((a,e)=>a+N(e[2]),0),by={};S.ex.forEach(e=>by[e[0]]=(by[e[0]]||0)+N(e[2]));
return `<div class="c"><small>قطة نوفمبر ٢٠٢٦ لنثريات الاستراحة</small><h2>الرصيد <span class="tot">${p*30-ex} ر.س</span></h2><p class="mu">المحصّل ${p*30} من ٤٢٠، والمصروف ${ex}</p></div>
<div class="c"><h3>من دفع ٣٠ ريال</h3>${M.map(m=>`<div class="li"><span>${m}</span>${S.admin?btn("paid",m,S.paid[m]?"دفع":"لم يدفع",S.paid[m]):S.paid[m]?'<span class="y">دفع</span>':'<span class="n">لم يدفع</span>'}</div>`).join("")}</div>
<div class="c"><h3>المصاريف</h3>${Object.keys(by).map(k=>`<div class="li"><b>${k}</b><b>${by[k]}</b></div>`).join("")}${S.ex.map(e=>`<div class="li"><span>${e[0]}${e[1]?": "+E(e[1]):""}</span><span>${N(e[2])}</span></div>`).join("")||'<p class="mu">ما فيه مصاريف مسجلة.</p>'}
${S.admin?`<div class="f"><select id="ec">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><input id="ep" type="number" placeholder="ر.س"></div><div class="f"><input id="et" placeholder="ملاحظة (اختياري)"><button class="b sel" data-a="exadd">سجّل مصروف</button></div>`:'<small>المشرف يسجّل الدفعات والمصاريف.</small>'}</div>`}

function ideas(){
return `<div class="c"><h3>اقتراحاتكم</h3><small>اقترح ميزة أو فعالية وصوّت لما يعجبك</small><div class="f"><input id="ii" placeholder="اقتراحك"><button class="b sel" data-a="idea">أضف</button></div></div>`+S.ideas.map((d,i)=>`<div class="c li" style="border-top:1px solid var(--bd)"><span>${E(d.t)}</span>${btn("vote",i,"👍 "+d.v.length,d.v.includes(S.me))}</div>`).join("")}

function R(){
const a=document.getElementById("app");
if(S.pend){a.innerHTML=hdr()+`<main><div class="c"><h2>${S.pend}</h2><p class="mu">هذا الاسم للمشرف. أدخل كلمة المرور.</p><div class="f"><input id="pw" type="password" autocomplete="off" placeholder="كلمة المرور"><button class="b sel" data-a="pw">دخول</button></div>${S.bad?'<p class="n">كلمة المرور غير صحيحة.</p>':""}<div class="row">${btn("back","","رجوع")}</div></div></main>`;return}
if(!S.me){a.innerHTML=hdr()+`<main><div class="c"><h2>حياك الله</h2><p class="mu">اختر اسمك للدخول</p><div class="g">${M.map(m=>btn("me",m,m)).join("")}</div></div></main>`;return}
a.innerHTML=hdr()+`<main>${[home,dinner,kashta,qatta,ideas][S.tab]()}</main><nav>${["اللقاء","العشاء","الكشتات","القطة","اقتراحات"].map((t,i)=>`<button data-a="tab" data-v="${i}" class="${S.tab==i?"on":""}">${t}</button>`).join("")}</nav>`}

const A={
me:v=>{S.bad=0;if(ADM.includes(v)){S.pend=v;return}S.me=v;S.ok=false;S.admin=false},back:()=>S.pend="",out:()=>{S.me="";S.ok=false;S.admin=false},pw:()=>{sha("diwaniya:"+V("pw")).then(h=>{if(h==HASH){S.me=S.pend;S.pend="";S.ok=true;S.admin=true;S.bad=0}else S.bad=1;save();R()})},tab:v=>S.tab=N(v),adm:()=>S.admin=!S.admin,
rsvp:v=>{S.rsvp[S.me]=v;if(v!="n")delete S.why[S.me]},why:v=>S.why[S.me]=v,
tv:v=>{const had=S.tv[v].includes(S.me);S.tv.cook=S.tv.cook.filter(x=>x!=S.me);S.tv.rest=S.tv.rest.filter(x=>x!=S.me);if(!had)S.tv[v].push(S.me)},
ov:v=>{const O=S[lead()=="cook"?"co":"ro"],had=O[N(v)].v.includes(S.me);O.forEach(o=>o.v=o.v.filter(x=>x!=S.me));if(!had)O[N(v)].v.push(S.me)},
oadd:()=>{const t=V("oi2");if(t)S[lead()=="cook"?"co":"ro"].push({t,i:"🍽️",v:[]})},
cook:v=>S.cook=v,shop:()=>{const t=V("si");if(t)S.shop.push(t)},
ord:()=>{const t=V("oi");if(t)(S.orders[S.me]=S.orders[S.me]||[]).push({t,p:N(V("op"))})},del:v=>S.orders[S.me].splice(N(v),1),
join:()=>S.join[S.me]=!S.join[S.me],gear:v=>{const g=S.gear[N(v)];g[1]=g[1]?"":S.me},
car:v=>{N(v)?S.cars[S.me]=N(v):delete S.cars[S.me]},kcadd:()=>{const t=V("kt");if(t)S.kc.push([t,N(V("kp"))])},
paid:v=>S.paid[v]=!S.paid[v],exadd:()=>{if(N(V("ep")))S.ex.push([V("ec"),V("et"),N(V("ep"))])},
idea:()=>{const t=V("ii");if(t)S.ideas.push({t,v:[]})},
vote:v=>{const d=S.ideas[N(v)],k=d.v.indexOf(S.me);k<0?d.v.push(S.me):d.v.splice(k,1)}};
function run(a,v){if(A[a]){A[a](v);save();R()}}
document.addEventListener("click",e=>{const t=e.target.closest("button[data-a]");if(t)run(t.dataset.a,t.dataset.v)});
document.addEventListener("change",e=>{if(e.target.tagName=="SELECT"&&e.target.dataset.a)run(e.target.dataset.a,e.target.value)});
R();
</script>
</body>
</html>
